<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Aroma Coffee</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header>
            <!-- 제목과 메뉴 -->
            <h1>Aroma Coffee</h1>
            <!-- 제목은 h1으로 정의한다. -->
            <nav>
                <!-- 하이퍼링크 묶음이므로 nav 영역을 정의한다. -->
                <ul>
                    <!-- 실제로 하이퍼링크를 묶는 ul을 정의하고, 그 안의 각각의 li를 넣는다.-->
                    <li>
                        <a href="index.html">Home</a>
                    </li>
                    <li>
                        <a href="menu.html">Menu</a>
                    </li>
                    <li>
                        <a href="about.html">About</a>
                    </li>
                </ul>
            </nav>
        </header>

        <main>
            <!-- 본문 -->
            <section class="section hero">
                <!-- div와 비슷하지만, 여기선 section이 더 적절하다. -->
                <h2>Fresh Coffee, <br class="mobile-break" />Every Day</h2>
                <!-- 본문은 h2으로 정의한다. -->
                <p>Premium coffee roasted every day</p>
                <!-- 문단 내용은 p태그를 사용한다.-->
                <img
                    src="/assets/coffee-picture.png"
                    alt="A drawn image that I made!"
                    class="index-image"
                />
            </section>
            <hr />
            <section class="section features">
                <h2>Why Choose AROMA?</h2>
                <ul>
                    <li>Quality</li>
                    <li>Freshness</li>
                    <li>Passion</li>
                </ul>
            </section>
        </main>

        <footer>
            <!-- 기타 정보 -->
            copyright &copy; 2026 <br class="mobile-break" />
            Aroma Coffee
        </footer>
    </body>
</html>
