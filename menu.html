<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Aroma Coffee</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header>
            <!-- 제목과 메뉴 -->
            <h1>Aroma Coffee</h1>
            <!-- 제목은 h1으로 정의한다. -->
            <nav>
                <!-- 하이퍼링크 묶음이므로 nav 영역을 정의한다. -->
                <ul>
                    <!-- 실제로 하이퍼링크를 묶는 ul을 정의하고, 그 안의 각각의 li를 넣는다.-->
                    <li>
                        <a href="index.html">Home</a>
                    </li>
                    <li>
                        <a href="menu.html">Menu</a>
                    </li>
                    <li>
                        <a href="about.html">About</a>
                    </li>
                </ul>
            </nav>
        </header>

        <main>
            <section class="section hero">
                <h2>Menu of Aroma Coffee</h2>
                <ul class="menu-list">
                    <li class="menu-card">1. Espresso mixed with cold water</li>
                    <li class="menu-card">2. Espresso mixed with hot water</li>
                </ul>
                <h3>This is our Pride.</h3>
                <img
                    src="/assets/menu-picture.png"
                    alt="Also a drawn image that I made!"
                    class="menu-image"
                />
            </section>
            <hr />
            <section class="section features">
                <h2>How to purchase?</h2>
                <p>Only call reservation available.</p>
                <p>Reservation number: ABC-DEFG-HIJK</p>
            </section>
        </main>

        <footer>
            <!-- 기타 정보 -->
            copyright &copy; 2026 <br class="mobile-break" />
            Aroma Coffee
        </footer>
    </body>
</html>
